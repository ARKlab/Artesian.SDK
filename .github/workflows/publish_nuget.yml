name: "Deploy to NuGet"

on:
  push:
    branches: [ master ]
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'
      - 'v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+'
      - 'v[0-9]+\.[0-9]+\.[0-9]+-PR[0-9]+\.[0-9]+'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  PACKAGE_OUTPUT_DIRECTORY: ${{ github.workspace }}/output
  NUGET_SOURCE_URL: 'https://api.nuget.org/v3/index.json'

permissions:
  id-token: write
  contents: write
  statuses: write
  checks: write

jobs:

  # ---------------------------------------------------------------------------
  # Build / Test
  # ---------------------------------------------------------------------------

  build:
    name: 'Build'
    runs-on: 'ubuntu-latest'

    defaults:
      run:
        working-directory: ./Artesian

    permissions:
      contents: read

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: 'Install dotnet'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.x
          10.x
        global-json-file: global.json

    - name: 'Restore packages'
      run: dotnet restore

    - name: 'Build project'
      run: dotnet build --no-restore --configuration Debug

    - name: 'Test'
      run: dotnet test --no-restore --configuration Debug -- --coverage --coverage-output-format cobertura --report-trx

    - name: 'Component detection'
      uses: advanced-security/component-detection-dependency-submission-action@v0.1.4
      
    - name: 'Create code coverage report'
      if: always()
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator \
          -reports:**/*.cobertura.xml \
          -targetdir:CodeCoverage \
          -reporttypes:'MarkdownSummaryGithub;Cobertura'

    - name: 'Write to Job Summary'
      if: always()
      run: cat CodeCoverage/SummaryGithub.md >> $GITHUB_STEP_SUMMARY


  # ---------------------------------------------------------------------------
  # Publish Stable
  #
  # Tag:
  #   v4.3.0
  #
  # Package version:
  #   4.3.0
  #
  # Must originate from:
  #   master
  # ---------------------------------------------------------------------------

  publish-stable:
    name: 'Publish Stable'
    runs-on: 'ubuntu-latest'
    needs: build

    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-beta') &&
      !contains(github.ref_name, '-PR')

    steps:
    - name: 'Validate GA release tag'
      shell: bash
      run: |
        TAG="${GITHUB_REF_NAME}"

        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid GA release tag: $TAG"
          echo "Expected format: vX.Y.Z"
          exit 1
        fi

        echo "Valid GA release tag: $TAG"

    - name: 'Checkout'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: 'Validate tag originates from master'
      shell: bash
      run: |
        git fetch origin master

        if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/master"; then
          echo "::error::Release tag $GITHUB_REF_NAME does not point to a commit contained in master."
          exit 1
        fi

        echo "Release commit is contained in master."

    - name: 'Install dotnet'
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: 'Pack project'
      shell: bash
      working-directory: ./Artesian/Artesian.SDK
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        OUTPUT_DIR="${GITHUB_WORKSPACE}/output"

        mkdir -p "$OUTPUT_DIR"

        dotnet pack \
          --configuration Release \
          --include-symbols \
          -p:Version="$VERSION" \
          --output "$OUTPUT_DIR"

    - name: 'Push package'
      shell: bash
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        PACKAGE="${GITHUB_WORKSPACE}/output/Artesian.SDK.${VERSION}.nupkg"

        if [[ ! -f "$PACKAGE" ]]; then
          echo "::error::Package not found: $PACKAGE"
          exit 1
        fi

        echo "Pushing package: $PACKAGE"

        dotnet nuget push "$PACKAGE" \
          --api-key "${{ secrets.NUGET_AUTH_TOKEN }}" \
          --source "${{ env.NUGET_SOURCE_URL }}"


  # ---------------------------------------------------------------------------
  # Publish Beta
  #
  # Tag:
  #   v4.3.0-beta.1
  #
  # Package version:
  #   4.3.0-beta.1
  #
  # Must originate from:
  #   develop-beta
  # ---------------------------------------------------------------------------

  publish-beta:
    name: 'Publish Beta'
    runs-on: 'ubuntu-latest'
    needs: build

    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      contains(github.ref_name, '-beta.')

    steps:
    - name: 'Validate Beta release tag'
      shell: bash
      run: |
        TAG="${GITHUB_REF_NAME}"

        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
          echo "::error::Invalid Beta release tag: $TAG"
          echo "Expected format: vX.Y.Z-beta.N"
          exit 1
        fi

        echo "Valid Beta release tag: $TAG"

    - name: 'Checkout'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: 'Validate tag originates from develop-beta'
      shell: bash
      run: |
        git fetch origin develop-beta

        if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/develop-beta"; then
          echo "::error::Beta release tag does not point to a commit contained in develop-beta."
          exit 1
        fi

        echo "Release commit is contained in develop-beta."

    - name: 'Validate next version'
      shell: bash
      run: |
        TAG="${GITHUB_REF_NAME}"

        git fetch origin master --tags

        MASTER_VERSION=$(
          git describe --tags --abbrev=0 origin/master |
          sed 's/^v//'
        )

        BETA_VERSION=$(
          echo "$TAG" |
          sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)-beta\.[0-9]+$/\1/'
        )

        MASTER_MAJOR=$(echo "$MASTER_VERSION" | cut -d. -f1)
        MASTER_MINOR=$(echo "$MASTER_VERSION" | cut -d. -f2)

        BETA_MAJOR=$(echo "$BETA_VERSION" | cut -d. -f1)
        BETA_MINOR=$(echo "$BETA_VERSION" | cut -d. -f2)

        if [[ "$BETA_MAJOR.$BETA_MINOR" != "$MASTER_MAJOR.$((MASTER_MINOR + 1))" ]]; then
          echo "::error::Beta version $BETA_VERSION is not the next minor version after master $MASTER_VERSION."
          exit 1
        fi

        echo "Beta version $BETA_VERSION is the next version after master $MASTER_VERSION."

    - name: 'Install dotnet'
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: 'Pack project'
      shell: bash
      working-directory: ./Artesian/Artesian.SDK
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        OUTPUT_DIR="${GITHUB_WORKSPACE}/output"

        mkdir -p "$OUTPUT_DIR"

        dotnet pack \
          --configuration Release \
          --include-symbols \
          -p:Version="$VERSION" \
          --output "$OUTPUT_DIR"

    - name: 'Push package'
      shell: bash
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        PACKAGE="${GITHUB_WORKSPACE}/output/Artesian.SDK.${VERSION}.nupkg"

        if [[ ! -f "$PACKAGE" ]]; then
          echo "::error::Package not found: $PACKAGE"
          exit 1
        fi

        echo "Pushing package: $PACKAGE"

        dotnet nuget push "$PACKAGE" \
          --api-key "${{ secrets.NUGET_AUTH_TOKEN }}" \
          --source "${{ env.NUGET_SOURCE_URL }}"


  # ---------------------------------------------------------------------------
  # Publish PR Preview
  #
  # Tag:
  #   v4.3.0-PR272.1
  #
  # Package version:
  #   4.3.0-PR272.1
  #
  # The PR Preview must be tested against the merged PR state.
  # ---------------------------------------------------------------------------

  publish-preview:
    name: 'Publish PR Preview'
    runs-on: 'ubuntu-latest'
    needs: build

    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      contains(github.ref_name, '-PR')

    steps:
    - name: 'Validate PR Preview tag'
      shell: bash
      run: |
        TAG="${GITHUB_REF_NAME}"

        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-PR[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid PR Preview tag: $TAG"
          echo "Expected format: vX.Y.Z-PR{PR_NUMBER}.{ITERATION}"
          exit 1
        fi

        echo "Valid PR Preview tag: $TAG"

    - name: 'Extract PR number'
      id: pr
      shell: bash
      run: |
        TAG="${GITHUB_REF_NAME}"

        PR_NUMBER=$(
          echo "$TAG" |
          sed -E 's/^v[0-9]+\.[0-9]+\.[0-9]+-PR([0-9]+)\.[0-9]+$/\1/'
        )

        echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

        echo "PR number: $PR_NUMBER"

    - name: 'Checkout merged PR head'
      uses: actions/checkout@v7
      with:
        ref: refs/pull/${{ steps.pr.outputs.number }}/merge
        fetch-depth: 0

    - name: 'Validate PR is based on current master'
      shell: bash
      run: |
        git fetch origin master

        CURRENT_MASTER=$(git rev-parse origin/master)
        MERGE_PARENT=$(git rev-parse HEAD^1)

        echo "Current master: $CURRENT_MASTER"
        echo "Merge parent:   $MERGE_PARENT"

        if [[ "$MERGE_PARENT" != "$CURRENT_MASTER" ]]; then
          echo "::error::PR Preview is not based on the current master."
          exit 1
        fi

        echo "PR Preview is based on master."

    - name: 'Validate preview version'
      shell: bash
      run: |
        TAG="${GITHUB_REF_NAME}"

        git fetch origin master --tags

        MASTER_VERSION=$(
          git describe --tags --abbrev=0 origin/master |
          sed 's/^v//'
        )

        PREVIEW_VERSION=$(
          echo "$TAG" |
          sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)-PR[0-9]+\.[0-9]+$/\1/'
        )

        echo "Master GA version: $MASTER_VERSION"
        echo "Preview version:   $PREVIEW_VERSION"

        if [[ "$PREVIEW_VERSION" != "$MASTER_VERSION" ]]; then
          echo "::error::PR Preview version $PREVIEW_VERSION does not match current master version $MASTER_VERSION."
          exit 1
        fi

        echo "PR Preview version matches master: $MASTER_VERSION"

    - name: 'Install dotnet'
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    # -----------------------------------------------------------------------
    # IMPORTANT:
    # The preview package is built and tested from the synthetic PR merge
    # commit, not from the original feature branch commit.
    # -----------------------------------------------------------------------

    - name: 'Build'
      working-directory: ./Artesian/Artesian.SDK
      run: |
        dotnet restore
        dotnet build --configuration Release --no-restore

    - name: 'Test'
      working-directory: ./Artesian
      run: |
        dotnet test \
          --no-restore \
          --configuration Release \
          -- \
          --coverage \
          --coverage-output-format cobertura \
          --report-trx
          
    - name: 'Create code coverage report'
      if: always()
      working-directory: ./Artesian
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator \
          -reports:**/*.cobertura.xml \
          -targetdir:CodeCoverage \
          -reporttypes:'MarkdownSummaryGithub;Cobertura'

    - name: 'Write to Job Summary'
      if: always()
      working-directory: ./Artesian
      run: cat CodeCoverage/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

    - name: 'Pack project'
      shell: bash
      working-directory: ./Artesian/Artesian.SDK
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        OUTPUT_DIR="${GITHUB_WORKSPACE}/output"

        mkdir -p "$OUTPUT_DIR"

        dotnet pack \
          --configuration Release \
          --include-symbols \
          -p:Version="$VERSION" \
          --output "$OUTPUT_DIR"

    - name: 'Push package'
      shell: bash
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        PACKAGE="${GITHUB_WORKSPACE}/output/Artesian.SDK.${VERSION}.nupkg"

        if [[ ! -f "$PACKAGE" ]]; then
          echo "::error::Package not found: $PACKAGE"
          exit 1
        fi

        echo "Pushing package: $PACKAGE"

        dotnet nuget push "$PACKAGE" \
          --api-key "${{ secrets.NUGET_AUTH_TOKEN }}" \
          --source "${{ env.NUGET_SOURCE_URL }}"